[package]
name = "shev"
version = "0.1.0"
edition = "2024"
description = "A simple Jev-like decision making tool, without the hype."
license = "Apache-2.0"
repository = "https://github.com/aditauqir/shev"
readme = "README.md"
# explicit targets: the TUI is `shev`, the line CLI is `shev-cli`
autobins = false
default-run = "shev"

[[bin]]
name = "shev"
path = "src/bin/shev.rs"

[[bin]]
name = "shev-cli"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 2
